<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS pontosító</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#5d6675;--ac:#1565c0;--ok:#2e7d32;--wa:#e65100;--bd:#d9dde4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#1a2029;--tx:#e8ecf2;--mut:#9aa5b5;--ac:#64a8f5;--ok:#6fcf74;--wa:#ffa65c;--bd:#2c3542}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#1a2029;--tx:#e8ecf2;--mut:#9aa5b5;--ac:#64a8f5;--ok:#6fcf74;--wa:#ffa65c;--bd:#2c3542}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding:12px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:6px 0 12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff;margin-top:8px}
button.s{background:var(--bd);color:var(--tx)}button:disabled{opacity:.4}
.big{font-size:28px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.due{border-color:var(--wa);box-shadow:0 0 0 2px var(--wa)}
.res{border-color:var(--ok)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
</style>
</head>
<body>
<h1>📍 GPS pontosító</h1>

<div class="c">
 <label>Célkoordináta (szélesség, hosszúság)</label>
 <input id="tgt" placeholder="47.123456, 19.123456" inputmode="text">
 <div class="row"><div><label style="margin-top:8px">Mentés ritmusa (perc)</label><input id="iv" type="number" value="10" min="1"></div>
 <div><label style="margin-top:8px">Átlagolási ablak (mp)</label><input id="win" type="number" value="60" min="10"></div></div>
</div>

<div class="c">
 <div class="mut">GPS állapot</div>
 <div class="big" id="st">várakozás…</div>
 <div class="mut" id="live"></div>
</div>

<div class="c" id="box">
 <div class="mut" id="ph">1. Add meg a célt, menj oda, és ha a telefon szerint ott vagy, nyomd meg az „Itt vagyok” gombot.</div>
 <div class="big" id="tm"></div>
 <button id="b1">Itt vagyok</button>
 <button id="b2" disabled>Mentés (a mostani helyen)</button>
 <button id="b3" class="s" disabled>Befejezés és számítás</button>
 <button id="b4" class="s">Újrakezdés</button>
</div>

<div class="c scroll" id="lg" style="display:none"></div>
<div class="c res" id="rs" style="display:none"></div>

<script>
const $=id=>document.getElementById(id);
const S={fixes:[],saves:[],start:null,last:0,wl:null};
const KEY='gpspont1';
function load(){try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);S.saves=o.saves||[];S.start=o.start||null;S.last=o.last||0;$('tgt').value=o.tgt||'';$('iv').value=o.iv||10}}catch(e){}}
function store(){try{localStorage.setItem(KEY,JSON.stringify({saves:S.saves,start:S.start,last:S.last,tgt:$('tgt').value,iv:$('iv').value}))}catch(e){}}
function parseT(){const m=$('tgt').value.replace(/,/g,' ').trim().split(/\s+/).map(Number);return m.length>=2&&m.every(isFinite)?{lat:m[0],lon:m[1]}:null}

function avgWindow(){
 const w=+$('win').value*1000,now=Date.now();
 let a=S.fixes.filter(f=>now-f.t<=w);if(a.length<3)a=S.fixes.slice(-5);
 if(!a.length)return null;
 let sw=0,la=0,lo=0,ac=0;
 for(const f of a){const k=1/Math.max(f.acc,1)**2;sw+=k;la+=f.lat*k;lo+=f.lon*k;ac+=f.acc}
 return{lat:la/sw,lon:lo/sw,acc:ac/a.length,n:a.length,t:now};
}
function addSave(){
 const a=avgWindow();if(!a){alert('Még nincs GPS-fix.');return}
 S.saves.push(a);S.last=Date.now();store();render();
 try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>S.wl=l).catch(()=>{})}catch(e){}}

$('b1').onclick=()=>{
 if(!parseT()){alert('Add meg a célkoordinátát, pl. 47.123456, 19.123456');return}
 if(!S.fixes.length){alert('Várj a GPS-fixre.');return}
 S.saves=[];S.start=Date.now();wake();addSave();
};
$('b2').onclick=addSave;
$('b3').onclick=finish;
$('b4').onclick=()=>{if(confirm('Törlöd az eddigi mentéseket?')){S.saves=[];S.start=null;S.last=0;store();render();$('rs').style.display='none'}};

function finish(){
 const T=parseT();if(!T||S.saves.length<2){alert('Legalább 2 mentés kell.');return}
 let sw=0,la=0,lo=0;
 for(const s of S.saves){const k=1/Math.max(s.acc,1)**2;sw+=k;la+=s.lat*k;lo+=s.lon*k}
 const m={lat:la/sw,lon:lo/sw},R=111320,c=Math.cos(T.lat*Math.PI/180);
 const dN=(T.lat-m.lat)*R,dE=(T.lon-m.lon)*R*c,d=Math.hypot(dN,dE);
 const br=(Math.atan2(dE,dN)*180/Math.PI+360)%360;
 const names=['É','ÉK','K','DK','D','DNy','Ny','ÉNy'],nm=names[Math.round(br/45)%8];
 let sN=0,sE=0;
 for(const s of S.saves){sN+=((s.lat-m.lat)*R)**2;sE+=((s.lon-m.lon)*R*c)**2}
 const sd=Math.sqrt((sN+sE)/Math.max(S.saves.length-1,1));
 const r=$('rs');r.style.display='block';
 r.innerHTML=`<div class="mut">Eredmény</div>
 <div class="big">${d<0.3?'Maradj itt (±0,3 m)':'Menj '+d.toFixed(1)+' m-t '+nm+' felé'}</div>
 <p>Irány: <b>${br.toFixed(0)}°</b> (${nm}), a <b>„Itt vagyok”</b> pontról indulva.<br>
 Észak: ${dN>=0?'+':''}${dN.toFixed(2)} m, Kelet: ${dE>=0?'+':''}${dE.toFixed(2)} m</p>
 <p class="mut">Átlagolt pozíció: ${m.lat.toFixed(7)}, ${m.lon.toFixed(7)}<br>${S.saves.length} mentés, szórás: ${sd.toFixed(1)} m.<br>
 Ez csak a véletlen zajt csökkenti; a rendszeres hibát (pl. ionoszféra) nem. Reális javulás: kb. 30–50%.</p>`;
}

function render(){
 const on=!!S.start;
 $('b1').disabled=on;$('b2').disabled=!on;$('b3').disabled=!on||S.saves.length<2;
 $('ph').textContent=on?`2. Sétálj 4–5 m-es körben az „Itt vagyok” pont körül, szimmetrikusan (É, K, D, Ny). ${$('iv').value} percenként nyomj mentést.`:'1. Add meg a célt, menj oda, és ha a telefon szerint ott vagy, nyomd meg az „Itt vagyok” gombot.';
 const lg=$('lg');
 if(S.saves.length){lg.style.display='block';
  lg.innerHTML='<table><tr><th>#</th><th>Idő</th><th>Fix</th><th>Pontosság</th></tr>'+S.saves.map((s,i)=>`<tr><td>${i+1}</td><td>${new Date(s.t).toLocaleTimeString('hu-HU')}</td><td>${s.n} db</td><td>±${s.acc.toFixed(1)} m</td></tr>`).join('')+'</table>'}
 else lg.style.display='none';
}

function tick(){
 const on=!!S.start;
 if(!on){$('tm').textContent='';$('box').classList.remove('due');return}
 const iv=(+$('iv').value||10)*60,e=(Date.now()-S.last)/1000,left=iv-e;
 if(left>0){const m=Math.floor(left/60),s=Math.floor(left%60);$('tm').textContent=`Következő mentés: ${m}:${String(s).padStart(2,'0')}`;$('box').classList.remove('due')}
 else{$('tm').textContent='⏰ Mentés esedékes!';$('box').classList.add('due');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
}

function startGps(){
 if(!navigator.geolocation){$('st').textContent='Nincs GPS-támogatás';return}
 navigator.geolocation.watchPosition(p=>{
  const c=p.coords;S.fixes.push({t:Date.now(),lat:c.latitude,lon:c.longitude,acc:c.accuracy||20});
  if(S.fixes.length>600)S.fixes.shift();
  $('st').textContent='±'+c.accuracy.toFixed(1)+' m';
  $('live').textContent=c.latitude.toFixed(7)+', '+c.longitude.toFixed(7)+' · '+S.fixes.length+' fix';
 },e=>{$('st').textContent='Hiba: '+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
load();render();startGps();setInterval(tick,1000);
$('tgt').addEventListener('change',store);$('iv').addEventListener('change',()=>{store();render()});
</script>
</body>
</html>
