<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS pontosító</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#5d6675;--ac:#1565c0;--ok:#2e7d32;--wa:#e65100;--bd:#d9dde4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#1a2029;--tx:#e8ecf2;--mut:#9aa5b5;--ac:#64a8f5;--ok:#6fcf74;--wa:#ffa65c;--bd:#2c3542}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#1a2029;--tx:#e8ecf2;--mut:#9aa5b5;--ac:#64a8f5;--ok:#6fcf74;--wa:#ffa65c;--bd:#2c3542}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding:12px;max-width:560px}
h1{font-size:20px;margin:6px 0 12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff;margin-top:8px}
button.s{background:var(--bd);color:var(--tx)}button:disabled{opacity:.4}
.big{font-size:28px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.res{border-color:var(--ok)}.due{border-color:var(--wa)}
.bar{height:8px;background:var(--bd);border-radius:4px;margin:8px 0}.bar>div{height:8px;background:var(--ok);border-radius:4px;width:0}
</style>
</head>
<body>
<h1>📍 GPS pontosító</h1>

<div class="c">
 <label>Célkoordináta (szélesség, hosszúság)</label>
 <input id="tgt" placeholder="46.829410, 17.976566">
 <div class="row">
  <div><label style="margin-top:8px">Mentések száma (min.)</label><input id="mn" type="number" value="10" min="3" inputmode="numeric"></div>
  <div><label style="margin-top:8px">Mentés ritmusa (perc)</label><input id="iv" type="number" value="3" min="1" step="0.5" inputmode="decimal"></div>
 </div>
</div>

<div class="c">
 <div class="mut">GPS pontosság</div>
 <div class="big" id="st">várakozás…</div>
 <div class="mut" id="live"></div>
 <div id="dist" style="margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--bd);display:none">
  <div class="mut">Távolság a céltól (10 mp átlag)</div>
  <div class="big" id="dv"></div>
  <div class="mut" id="dd"></div>
  <div id="arw" style="display:none;text-align:center;font-size:72px;line-height:1.2;margin-top:6px;transition:transform .25s;color:var(--ac)">⬆</div>
  <button id="cb" class="s">🧭 Iránytű bekapcsolása</button>
 </div>
</div>

<div class="c res" id="rs" style="display:none"></div>

<div class="c" id="box">
 <div class="mut" id="ph">Menj oda, ahol a telefon szerint a cél van, és állj meg. Nyomd meg az „Indítás” gombot, és maradj ott, a többit az app végzi.</div>
 <div class="bar"><div id="pb"></div></div>
 <div class="big" id="tm" style="font-size:20px"></div>
 <button id="b1">Indítás (itt állok)</button>
 <button id="b2" class="s" style="display:none">Mentés most</button>
 <button id="b3" style="display:none" disabled>Befejezés és számítás</button>
 <button id="b4" class="s" style="display:none">Újrakezdés</button>
</div>

<script>
const $=id=>document.getElementById(id);
const S={fixes:[],saves:[],start:0,last:0,h:null,br:null};
const KEY='gpspont2';
function store(){try{localStorage.setItem(KEY,JSON.stringify({saves:S.saves,start:S.start,last:S.last,tgt:$('tgt').value,iv:$('iv').value,mn:$('mn').value}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o){S.saves=o.saves||[];S.start=o.start||0;S.last=o.last||0;$('tgt').value=o.tgt||'';$('iv').value=o.iv||3;$('mn').value=o.mn||10}}catch(e){}}
function parseT(){
 const m=($('tgt').value.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>Number(x.replace(',','.')));
 if(m.length!==2||Math.abs(m[0])>90||Math.abs(m[1])>180)return null;
 return{lat:m[0],lon:m[1]};
}
function avg(ms){
 const now=Date.now();let a=S.fixes.filter(f=>now-f.t<=ms);if(a.length<3)a=S.fixes.slice(-5);
 if(!a.length)return null;
 let sw=0,la=0,lo=0,ac=0;
 for(const f of a){const k=1/Math.max(f.acc,1)**2;sw+=k;la+=f.lat*k;lo+=f.lon*k;ac+=f.acc}
 return{lat:la/sw,lon:lo/sw,acc:ac/a.length,n:a.length,t:now};
}
const fmt=d=>d<1?Math.round(d*100)+' cm':d.toFixed(1)+' m';
const NM=['É','ÉK','K','DK','D','DNy','Ny','ÉNy'];
function vec(T,m){
 const R=111320,c=Math.cos(T.lat*Math.PI/180);
 const dN=(T.lat-m.lat)*R,dE=(T.lon-m.lon)*R*c;
 const br=(Math.atan2(dE,dN)*180/Math.PI+360)%360;
 return{dN,dE,d:Math.hypot(dN,dE),br,nm:NM[Math.round(br/45)%8]};
}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}

function addSave(){
 const lf=S.fixes[S.fixes.length-1];
 if(!lf||Date.now()-lf.t>30000)return; // elavult fix: nem mentünk, amíg nem jön friss
 const a=avg(60000);if(!a)return;
 S.saves.push(a);S.last=Date.now();store();render();
 try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
}
function finish(){
 const T=parseT(),mn=+$('mn').value||10;
 if(!T||S.saves.length<mn)return;
 const R=111320,c=Math.cos(T.lat*Math.PI/180);
 let sw=0,la=0,lo=0;
 for(const s of S.saves){const k=1/Math.max(s.acc,1)**2;sw+=k;la+=s.lat*k;lo+=s.lon*k}
 const m={lat:la/sw,lon:lo/sw},v=vec(T,m);
 let q=0;for(const s of S.saves)q+=((s.lat-m.lat)*R)**2+((s.lon-m.lon)*R*c)**2;
 const n=S.saves.length,sd=Math.sqrt(q/(n-1)),se=sd/Math.sqrt(n);
 const r=$('rs');r.style.display='block';
 r.innerHTML=`<div class="mut">Eredmény (onnan, ahol most állsz)</div>
 <div class="big">${v.d<0.05?'Itt van a célpont':'Menj '+fmt(v.d)+'-t '+v.nm+' felé'}</div>
 <p>Irány: <b>${v.br.toFixed(0)}°</b> (${v.nm}) · Észak: ${v.dN>=0?'+':''}${(v.dN*100).toFixed(0)} cm · Kelet: ${v.dE>=0?'+':''}${(v.dE*100).toFixed(0)} cm</p>
 <p class="mut">${n} mentés · szórás: ${sd.toFixed(1)} m · az átlag zaja: ±${se.toFixed(1)} m.<br>
 Az átlagolás a véletlen zajt csökkenti, a rendszeres GPS-hibát nem, ezért a valós pontosság kb. 1,5–3 m. Az eredmény akkor jó, ha végig nagyjából egy helyben álltál (max. 2–3 m).</p>`;
 setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}),50);
}

function render(){
 const on=!!S.start,mn=+$('mn').value||10,n=S.saves.length;
 $('b1').style.display=on?'none':'block';
 for(const id of ['b2','b3','b4'])$(id).style.display=on?'block':'none';
 $('b3').disabled=n<mn;
 $('pb').style.width=Math.min(100,n/mn*100)+'%';
 $('ph').textContent=on?'Maradj egy helyben (max. 2–3 m-es körben). Az app magától ment, a Befejezés a minimum mentés után aktív.':'Menj oda, ahol a telefon szerint a cél van, és állj meg. Nyomd meg az „Indítás” gombot, és maradj ott, a többit az app végzi.';
}
function tick(){
 if(!S.start){$('tm').textContent='';$('box').classList.remove('due');return}
 const iv=(+$('iv').value||3)*60,left=iv-(Date.now()-S.last)/1000,mn=+$('mn').value||10;
 if(left<=0){addSave();return}
 const m=Math.floor(left/60),s=Math.floor(left%60);
 $('tm').textContent=`Mentések: ${S.saves.length} / ${mn} · következő: ${m}:${String(s).padStart(2,'0')}`;
}

$('b1').onclick=()=>{
 if(!parseT()){alert('Add meg a célkoordinátát, pl. 46.829410, 17.976566');return}
 if(!S.fixes.length){alert('Várj a GPS-fixre.');return}
 S.saves=[];S.start=Date.now();wake();$('rs').style.display='none';addSave();
};
$('b2').onclick=addSave;
$('b3').onclick=finish;
$('b4').onclick=()=>{if(confirm('Törlöd az eddigi mentéseket?')){S.saves=[];S.start=0;S.last=0;store();render();$('rs').style.display='none'}};

// élő távolság + iránytű
function rot(){const a=$('arw');if(S.h==null||S.br==null){a.style.display='none';return}a.style.display='block';a.style.transform='rotate('+(S.br-S.h)+'deg)'}
function updDist(){
 const T=parseT(),box=$('dist');
 if(!T||!S.fixes.length){S.br=null;rot();box.style.display=$('tgt').value.trim()?'block':'none';
  $('dv').textContent=T?'Várakozás a GPS-re…':'Hibás koordináta';$('dd').textContent=T?'':'Írd így: 46.829410, 17.976566';return}
 const a=avg(10000),v=vec(T,a);S.br=v.br;rot();
 box.style.display='block';
 box.style.borderColor=v.d<=1.5?'var(--ok)':v.d<=5?'var(--wa)':'var(--bd)';
 $('dv').textContent=v.d<=1.5?'✔ Célon vagy':v.d<100?v.d.toFixed(1)+' m':Math.round(v.d)+' m';
 $('dd').textContent='Irány: '+v.br.toFixed(0)+'° ('+v.nm+')';
}
function onOri(e){
 let h=null;
 if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
 else if((e.absolute||e.type==='deviceorientationabsolute')&&e.alpha!=null)h=(360-e.alpha)%360;
 if(h==null||!isFinite(h))return;
 if(S.h==null)S.h=h;else{const d=((h-S.h+540)%360)-180;S.h=(S.h+d*0.25+360)%360}
 rot();
}
async function enableCompass(){
 try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
   if(await DeviceOrientationEvent.requestPermission()!=='granted'){alert('Az iránytű engedélye meg lett tagadva.');return}
   addEventListener('deviceorientation',onOri,true);
  }else{addEventListener('deviceorientationabsolute',onOri,true);addEventListener('deviceorientation',onOri,true)}
  $('cb').style.display='none';
 }catch(e){alert('Az iránytű nem elérhető: '+e.message)}
}
$('cb').onclick=enableCompass;

function startGps(){
 if(!navigator.geolocation){$('st').textContent='Nincs GPS-támogatás';return}
 navigator.geolocation.watchPosition(p=>{
  const c=p.coords;S.fixes.push({t:Date.now(),lat:c.latitude,lon:c.longitude,acc:c.accuracy||20});
  if(S.fixes.length>600)S.fixes.shift();
  $('st').textContent='±'+c.accuracy.toFixed(1)+' m';
  $('live').textContent=c.latitude.toFixed(7)+', '+c.longitude.toFixed(7)+' · '+S.fixes.length+' fix';
  updDist();
 },e=>{$('st').textContent='Hiba: '+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
load();render();startGps();setInterval(tick,1000);
$('tgt').addEventListener('change',()=>{store();updDist()});$('tgt').addEventListener('input',updDist);
$('iv').addEventListener('change',store);$('mn').addEventListener('change',()=>{store();render()});
</script>
</body>
</html>
